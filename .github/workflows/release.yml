name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - name: Build app
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent Clipstack.app Clipstack.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: build/Clipstack.zip
